<!DOCTYPE html>
<html>
<head>
    <title>Ali El Boukhari - Portfolio Tracker</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .portfolio-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        .profit { color: #27ae60; font-weight: bold; }
        .loss { color: #e74c3c; font-weight: bold; }
        .total { font-weight: bold; background-color: #f8f9fa; }
    </style>
</head>
<body>
    <div class="portfolio-container">  <!-- Correction ici -->
        <h1>📊 Mon Portefeuille d'Investissement</h1>
        <p>Dernière mise à jour : <strong>2 juin 2024</strong></p>
        
        <table>
            <thead>
                <tr>
                    <th>Actif</th>
                    <th>Nombre</th>
                    <th>Prix d'Entrée</th>
                    <th>Date Entrée</th>
                    <th>Prix Actuel</th>
                    <th>Date MAJ</th>
                    <th>P/L</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Bitcoin</td>
                    <td>1</td>
                    <td>2410,2</td>
                    <td>28/05/2024</td>
                    <td>1836</td>
                    <td>01/06/2024</td>
                    <td class="loss">-574,2</td>
                </tr>
                <tr>
                    <td>ETH/USD</td>
                    <td>2,7</td>
                    <td>405,2</td>
                    <td>03/05/2024</td>
                    <td>425</td>
                    <td>01/06/2024</td>
                    <td class="profit">+53,46</td>
                </tr>
                <tr class="total">
                    <td colspan="6">Total P/L</td>
                    <td class="loss">-520,74</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
